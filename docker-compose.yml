services:
  web:
    image: ghcr.io/egidijusjaka/ai-jakavonis:latest
    container_name: ai-jakavonis
    restart: unless-stopped
    networks:
      - traefik-net
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-jakavonis.rule=Host(`ai.jakavonis.lt`)"
      - "traefik.http.routers.ai-jakavonis.entrypoints=websecure"
      - "traefik.http.routers.ai-jakavonis.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-jakavonis.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  traefik-net:
    external: true
